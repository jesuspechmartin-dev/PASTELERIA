<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doña Bellita Pastelería · Punto de Venta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff1f7;--card:#fff;--tx:#4a1d33;--mu:#8f5b75;--ac:#de2976;--ac2:#fde0ee;--bd:#f5cfe1;--ok:#15803d;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1d;--card:#381628;--tx:#fbe6f0;--mu:#c89bb2;--ac:#f0549a;--ac2:#552139;--bd:#5a2a43;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#2a0f1d;--card:#381628;--tx:#fbe6f0;--mu:#c89bb2;--ac:#f0549a;--ac2:#552139;--bd:#5a2a43;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;padding:12px}
h1{font-size:18px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--tx)}
button.r{background:transparent;color:var(--bad);padding:4px 8px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px 4px;background:var(--ac2);color:var(--tx)}
.tabs button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;color:var(--tx);font-weight:500}
.p b{display:block;color:var(--ac);margin-top:4px}
.p small{display:block;font-weight:400;color:var(--mu)}
.p.low small{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.q{display:flex;align-items:center;gap:8px}
.q button{padding:2px 10px}
.tot{font-size:22px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;align-items:center}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad)}
#ticket .lg{display:block;margin:0 auto 8px;width:72px;height:72px;border-radius:50%}
.lb{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.lb input,.lb select{height:52px;border-radius:14px;border-width:1.5px;padding:0 16px;font-size:16px}
pre{margin:0;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
@media print{
  body *{visibility:hidden}
  #ticket,#ticket *{visibility:visible}
  #ticket{position:absolute;left:0;top:0;width:100%;border:0;background:#fff;color:#000}
  .np{display:none!important}
}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;z-index:50;background:var(--ac);overflow:auto;display:none">
<div style="min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column">
<div style="flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;padding:28px 0">
<img id="logo2" alt="Doña Bellita Pastelería" width="140" height="140" style="border-radius:50%">
</div>
<form id="lf" style="background:var(--card);border-radius:32px 32px 0 0;padding:32px 28px 36px;display:flex;flex-direction:column;gap:16px">
<div><h2 id="lt" style="margin:0;font-size:28px;font-weight:800">Bienvenido</h2><p id="ls" class="mu" style="margin:4px 0 0;font-size:15px">Inicia sesión para abrir tu caja</p></div>
<label class="lb">Usuario<input id="lu" type="text" autocomplete="username" placeholder="Tu usuario"></label>
<label class="lb">Contraseña<input id="lp" type="password" autocomplete="current-password" placeholder="••••••••"></label>
<label class="lb" id="lcw" style="display:none">Confirmar contraseña<input id="lp2" type="password" autocomplete="new-password" placeholder="••••••••"></label>
<label class="lb">Sucursal<select id="lb2"></select></label>
<p id="le" class="bad" style="margin:0"></p>
<button id="lbtn" type="submit" style="height:54px;font-size:17px;font-weight:800">Entrar</button>
</form>
</div>
</div>

  <button data-t="caja">Caja</button>

<script>
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const LOW=3;
const DEF=()=>({list:[
 {id:1,n:'Rebanada de pastel de chocolate',p:45,s:null},{id:2,n:'Rebanada de pastel de vainilla',p:40,s:null},
 {id:3,n:'Pastel mediano (12 porciones)',p:380,s:null},{id:4,n:'Pastel grande (20 porciones)',p:620,s:null},
 {id:5,n:'Cupcake',p:30,s:null},{id:6,n:'Galleta',p:15,s:null},{id:7,n:'Pan dulce',p:12,s:null},{id:8,n:'Gelatina',p:25,s:null}],nid:9});
let branch='Motul',P=DEF(),S=[],C={},cajaDate=ymd();
let tab='venta',cart={},pay={m:'Efectivo',rec:''},msg='',ticket=null,repDate=ymd();

function load(){
  P=DEF();S=[];C={};
  try{const r=JSON.parse(localStorage.getItem('pos3_'+branch)||'null');if(r){if(r.P)P=r.P;if(r.S)S=r.S;if(r.C)C=r.C}}catch(e){}
}
function save(){try{localStorage.setItem('pos3_'+branch,JSON.stringify({P,S,C}));localStorage.setItem('pos3_branch',branch)}catch(e){msg='⚠️ No se pudo guardar en este dispositivo'}}
try{const b=localStorage.getItem('pos3_branch');if(b)branch=b}catch(e){}
load();
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;stockChk=null;if(tab==='caja')cajaDate=ymd();document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));msg='';render()});

const prod=id=>P.list.find(x=>x.id==id);
const total=()=>Object.entries(cart).reduce((s,[id,q])=>{const p=prod(id);return s+(p?p.p*q:0)},0);

function add(id){
  const p=prod(id),q=(cart[id]||0)+1;
  if(p.s!==null&&q>p.s){msg='⚠️ Solo quedan '+p.s+' de '+p.n;render();return}
  cart[id]=q;msg='';render();
}
function chg(id,d){
  const p=prod(id),q=(cart[id]||0)+d;
  if(d>0&&p.s!==null&&q>p.s){msg='⚠️ Solo quedan '+p.s+' de '+p.n;render();return}
  if(q<=0)delete cart[id];else cart[id]=q;render();
}
function cobrar(){
  const t=total();if(!t)return;
  if(C[ymd()]&&C[ymd()].closed){msg='🔒 La caja de hoy está cerrada. Reábrela en la pestaña Caja.';render();return}
  const rec=pay.m==='Efectivo'?parseFloat(pay.rec)||0:t;
  if(pay.m==='Efectivo'&&rec<t){msg='⚠️ El efectivo recibido es menor al total.';render();return}
  const items=Object.entries(cart).map(([id,q])=>{const p=prod(id);if(p.s!==null)p.s-=q;return{id:p.id,n:p.n,p:p.p,q}});
  const now=new Date();
  const sale={id:now.getTime(),d:ymd(now),t:now.toISOString(),items,total:t,m:pay.m,rec,ch:rec-t};
  S.push(sale);save();ticket=sale;cart={};pay.rec='';msg='';render();
}
function ticketText(s){
  const w=32,line='-'.repeat(w);
  const dt=new Date(s.t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
  const rows=s.items.map(i=>{const l=i.q+' x '+i.n,r=money(i.p*i.q);return l.length+r.length+1>w?l+'\n'+' '.repeat(Math.max(1,w-r.length))+r:l+' '.repeat(w-l.length-r.length)+r}).join('\n');
  return `DOÑA BELLITA\nPASTELERÍA\nSucursal ${branch}\n${dt}\n${line}\n${rows}\n${line}\nTOTAL: ${money(s.total)}\nPago: ${s.m}`+(s.m==='Efectivo'?`\nRecibido: ${money(s.rec)}\nCambio: ${money(s.ch)}`:'')+`\n${line}\n¡Gracias por su compra!`;
}
function imprimir(){try{window.print()}catch(e){msg='⚠️ Imprimir no está disponible aquí';render()}}
function addProd(){
  const n=$('#nn').value.trim(),p=parseFloat($('#np').value),sv=$('#ns').value;
  if(!n||isNaN(p)||p<0)return;
  P.list.push({id:P.nid++,n,p,s:sv===''?null:Math.max(0,parseInt(sv))});save();render();
}
function delProd(id){if(confirm('¿Eliminar producto?')){P.list=P.list.filter(x=>x.id!==id);save();render()}}
function editPrice(id,v){const p=prod(id),n=parseFloat(v);if(p&&!isNaN(n)){p.p=n;save()}}
function editStock(id,v){const p=prod(id);if(!p)return;p.s=v===''?null:Math.max(0,parseInt(v)||0);save();render()}
function delSale(id){
  if(!confirm('¿Cancelar esta venta? Se regresará el producto al inventario.'))return;
  const s=S.find(x=>x.id===id);if(!s)return;
  s.items.forEach(i=>{const p=prod(i.id);if(p&&p.s!==null)p.s+=i.q});
  S=S.filter(x=>x.id!==id);save();render();
}


function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t))}
function cajaBanner(){
  const c=C[ymd()];
  if(c&&c.closed)return '<div class="card np">🔒 La caja de hoy está cerrada.</div>';
  if(c&&c.start!=null)return '';
  return '<div class="card np">⚠️ Aún no registras el fondo inicial de hoy. <button class="g" style="margin-top:6px" onclick="cajaDate=ymd();setTab(\'caja\');render()">Ir a Caja</button></div>';
}
function cget(d){return C[d]||(C[d]={start:null,out:0,counted:null,closed:false,at:null})}
function cset(k,v){const c=cget(cajaDate);const n=parseFloat(v);c[k]=isNaN(n)?(k==='out'?0:null):Math.max(0,n);save();render()}
function cerrar(){
  const c=cget(cajaDate);
  if(c.start==null){msg='⚠️ Captura primero el fondo inicial.';render();return}
  if(c.counted==null){msg='⚠️ Captura el efectivo contado para cerrar.';render();return}
  if(cajaDate===ymd()&&trackedProds().length){stockChk=stockChk||{};stockMsg='';render();window.scrollTo({top:0});return}
  finalizar(c);
}
function finalizar(c){c.closed=true;c.at=new Date().toISOString();msg='';save();render()}
function reabrir(){const c=cget(cajaDate);c.closed=false;c.at=null;c.stock=null;save();render()}
let stockChk=null,stockMsg='';
const trackedProds=()=>P.list.filter(p=>p.s!==null);
function stockDiff(p){
  const v=stockChk[p.id];if(v===undefined||v===''||isNaN(parseInt(v)))return '';
  const d=parseInt(v)-p.s;
  return d===0?'<span class="ok">✔</span>':'<span class="bad">'+(d>0?'+':'')+d+'</span>';
}
function stockBtnLabel(){
  const n=trackedProds().filter(p=>{const v=stockChk[p.id];return v!==undefined&&v!==''&&!isNaN(parseInt(v))&&parseInt(v)!==p.s}).length;
  return n?'Ajustar inventario y cerrar caja ('+n+')':'Confirmar inventario y cerrar caja';
}
function stockIn(id,v){stockChk[id]=v;$('#sd'+id).innerHTML=stockDiff(prod(id));$('#sbtn').textContent=stockBtnLabel()}
function stockTodo(){trackedProds().forEach(p=>stockChk[p.id]=String(p.s));render()}
function stockCard(){
  if(stockChk===null)return '';
  return `<div class="card np"><b>📦 Validar inventario antes de cerrar</b>
  <div class="mu">Cuenta lo que hay físicamente y captúralo. Si hay diferencias, el sistema se ajustará a tu conteo y quedará registrado en el corte.</div>
  ${trackedProds().map(p=>`<div class="three" style="margin-top:8px"><span>${esc(p.n)}<br><span class="mu">Sistema: ${p.s}</span></span><input type="number" inputmode="numeric" placeholder="Conteo" value="${stockChk[p.id]===undefined?'':stockChk[p.id]}" oninput="stockIn(${p.id},this.value)"><span id="sd${p.id}">${stockDiff(p)}</span></div>`).join('')}
  <div class="two" style="margin-top:10px"><button class="g" onclick="stockChk=null;stockMsg='';render()">Cancelar</button><button class="g" onclick="stockTodo()">Todo coincide</button></div>
  <button id="sbtn" style="width:100%;margin-top:8px" onclick="confirmarStock()">${stockBtnLabel()}</button>
  ${stockMsg?`<p>${stockMsg}</p>`:''}</div>`;
}
function confirmarStock(){
  const T=trackedProds();
  const miss=T.filter(p=>{const v=stockChk[p.id];return v===undefined||v===''||isNaN(parseInt(v))});
  if(miss.length){stockMsg='⚠️ Falta capturar el conteo de: '+miss.map(p=>p.n).join(', ');render();return}

  stockChk=null;stockMsg='';finalizar(c);
}

let repMode='dia';
const pd=x=>{const[y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
function getRange(x,mode){

  if(mode==='semana'){const f=new Date(dt);f.setDate(dt.getDate()-((dt.getDay()+6)%7));const t=new Date(f);t.setDate(f.getDate()+6);return[ymd(f),ymd(t)]}

function shiftRep(dir){

let BR=['Motul','Tixkokob'],bmsg='';
function canAccess(f,br){return !!f&&BR.includes(br)&&(f.owner||f.b===br||!!f.both)}
function branchError(f,br){
  if(f.owner)return '';
  if(!BR.includes(f.b)&&!f.both)return 'Este usuario no tiene sucursal asignada. Pide al superusuario que se la asigne.';
  if(!canAccess(f,br))return 'No perteneces a la sucursal '+br+'. Tu sucursal asignada es '+f.b+'. Solo el superusuario puede autorizar acceso a otras sucursales.';
  return '';
}
let U=[],me=null,umsg='';
async function hash(x,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+x));return Array.from(new Uint8Array(b)).map(v=>v.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const t=salt+':'+x;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16)}
}

async function doLogin(e){
  e.preventDefault();

  const err=m=>{$('#le').textContent=m};
  if(!u||!pw){err('Escribe tu usuario y contraseña.');return}
  if(first){
    if(pw.length<4){err('La contraseña debe tener al menos 4 caracteres.');return}
    if(pw!==$('#lp2').value){err('Las contraseñas no coinciden.');return}
    const salt=Math.random().toString(36).slice(2);
    U=[{u,s:salt,h:await hash(pw,salt),owner:true,b:'Todas'}];saveUsers();me=U[0];
  }else{
    const f=U.find(x=>x.u.toLowerCase()===u.toLowerCase());
    if(!f||await hash(pw,f.s)!==f.h){err('Usuario o contraseña incorrectos.');return}
    const bm=branchError(f,br);if(bm){err(bm);return}
    me=f;
  }

    <div class="two"><select id="pm"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select>
    <input id="rec" type="number" inputmode="decimal" placeholder="Efectivo recibido" ${pay.m==='Efectivo'?'':'disabled'} value="${esc(pay.rec)}"></div>
    <p class="ok" id="chg"></p>
    <div class="two"><button class="g" onclick="cart={};render()">Vaciar</button><button onclick="cobrar()">Cobrar</button></div>
    ${msg?`<p>${msg}</p>`:''}</div>`;
    $('#pm').value=pay.m;
    $('#pm').onchange=e=>{pay.m=e.target.value;render()};
    const upd=()=>{const r=parseFloat(pay.rec)||0;$('#chg').textContent=(pay.m==='Efectivo'&&t>0&&r>=t)?'Cambio: '+money(r-t):''};
    $('#rec').oninput=e=>{pay.rec=e.target.value;upd()};upd();
  }else if(tab==='prod'){
    a.innerHTML=`<div class="card"><b>Agregar producto</b>
    <div class="three" style="margin-top:8px"><input id="nn" placeholder="Nombre"><input id="np" type="number" inputmode="decimal" placeholder="Precio"><input id="ns" type="number" inputmode="numeric" placeholder="Stock"></div>
    <div class="mu">Deja el stock vacío si no quieres controlar inventario de ese producto.</div>
    <button style="margin-top:8px;width:100%" onclick="addProd()">Agregar</button></div>
    <div class="card"><div class="three mu"><span>Producto</span><span>Precio</span><span>Stock</span></div>
    ${P.list.map(p=>`<div class="three"><span>${esc(p.n)}${p.s!==null&&p.s<=LOW?' <span class="bad">⚠️</span>':''}</span><input type="number" inputmode="decimal" value="${p.p}" onchange="editPrice(${p.id},this.value)"><span style="display:flex;gap:2px"><input type="number" inputmode="numeric" placeholder="—" value="${p.s===null?'':p.s}" onchange="editStock(${p.id},this.value)"><button class="r" onclick="delProd(${p.id})">✕</button></span></div>`).join('')}</div>${msg?`<p>${msg}</p>`:''}`;
    if(me&&me.owner)a.insertAdjacentHTML('beforeend',branchCard()+userCard()+backupCard());
  }else if(tab==='caja'){
    renderCaja(a);
  }else if(repMode!=='dia'){
    renderPeriodo(a);
  }else{
    const L=SS().filter(s=>s.d===repDate).sort((x,y)=>x.t<y.t?-1:1);
    const sum=(f,arr=L)=>arr.filter(f).reduce((x,s)=>x+s.total,0);
    const prods={};L.forEach(s=>s.items.forEach(i=>prods[i.n]=(prods[i.n]||0)+i.q));
    const byDay={};SS().forEach(s=>byDay[s.d]=(byDay[s.d]||0)+s.total);
    const days=Object.keys(byDay).sort().reverse().slice(0,14);
    const low=isAll()?[]:P.list.filter(p=>p.s!==null&&p.s<=LOW);
    a.innerHTML=`${modeBar()}<div class="mu">${scopeLabel()} · elige un día</div>
    <input id="rd" type="date" value="${repDate}">
    <div class="card"><div class="tot">${money(sum(()=>true))}</div><div class="mu">${L.length} ventas el ${repDate}</div>
    <div class="row"><span>Efectivo</span><span>${money(sum(s=>s.m==='Efectivo'))}</span></div>
    <div class="row"><span>Tarjeta</span><span>${money(sum(s=>s.m==='Tarjeta'))}</span></div>
    <div class="row"><span>Transferencia</span><span>${money(sum(s=>s.m==='Transferencia'))}</span></div></div>
    ${low.length?`<div class="card"><b class="bad">⚠️ Inventario bajo</b>${low.map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="bad">${p.s}</span></div>`).join('')}</div>`:''}
    <div class="card"><b>Productos vendidos</b>${Object.entries(prods).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><span>${q}</span></div>`).join('')||'<p class="mu">Sin ventas ese día.</p>'}</div>
    <div class="card"><b>Ventas</b>${L.slice().reverse().map(s=>`<div class="row"><span>${new Date(s.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})} · ${s.br?esc(s.br)+' · ':''}${s.m}</span><span>${money(s.total)} ${s.br?'':`<button class="r" onclick="ticket=S.find(x=>x.id==${s.id});tab='venta';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='venta'));render()">🧾</button>${me&&me.owner?'<button class="r" onclick="delSale('+s.id+')">✕</button>':''}`}</span></div>`).join('')||'<p class="mu">Sin ventas ese día.</p>'}</div>
    <div class="card"><b>Historial por día</b>${days.map(d=>`<div class="row"><a href="#" style="color:var(--ac)" onclick="repDate='${d}';render();return false">${d}</a><span>${money(byDay[d])}</span></div>`).join('')||'<p class="mu">Aún no hay ventas.</p>'}</div>${msg?`<p>${msg}</p>`:''}`;
    $('#rd').onchange=e=>{if(e.target.value){repDate=e.target.value;render()}};
    if(isAll())a.querySelector('.card').insertAdjacentHTML('afterend',branchSplit(L));
  }
}
</script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const DOM='@bellita.app',CACHE={};
let busy=false,ch=null,rt=null,poll=null;
function load(){const r=CACHE[branch];P=r?r.P:{list:[],nid:0};S=r?r.S:[];C=r?r.C:{}}
async function fetchAll(f){let out=[],i=0;for(;;){const r=await f(i,i+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break;i+=1000}return out}
async function loadBranchData(b,d0){
  const pr=await sb.from('products').select('id,n,p,s').eq('branch',b).order('id');
  if(pr.error)throw pr.error;
  const sa=await fetchAll((a,z)=>sb.from('sales').select('*').eq('branch',b).gte('d',d0).order('id').range(a,z));
  const ca=await sb.from('cajas').select('d,value').eq('branch',b).gte('d',d0);
  if(ca.error)throw ca.error;
  const C={};ca.data.forEach(x=>{C[x.d]=x.value});
  return{P:{list:pr.data.map(x=>({id:x.id,n:x.n,p:Number(x.p),s:x.s})),nid:0},
    S:sa.map(x=>({id:x.id,d:x.d,t:x.t,items:x.items,total:Number(x.total),m:x.m,rec:Number(x.rec),ch:Number(x.ch)})),C};
}
async function pull(b,days=92,merge=false){
  const d0=ymd(new Date(Date.now()-days*864e5));
  const o=await loadBranchData(b,d0);
  if(merge&&CACHE[b]){o.S=CACHE[b].S.filter(x=>x.d<d0).concat(o.S);o.C=Object.assign({},CACHE[b].C,o.C)}
  CACHE[b]=o;
}
async function refresh(){
  if(!me||!branch)return;
  try{
    await pull(branch,2,true);load();
    const a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
  }catch(e){}
}
function subscribeRT(){
  stopRT();
  const on=()=>{clearTimeout(rt);rt=setTimeout(refresh,500)};
  ch=sb.channel('pos-'+Date.now());
  ['products','sales','cajas'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{const b=(p.new&&p.new.branch)||(p.old&&p.old.branch);if(!b||b===branch)on()}));
  ch.subscribe();
  poll=setInterval(refresh,15000);
}
function stopRT(){clearTimeout(rt);clearInterval(poll);poll=null;if(ch){sb.removeChannel(ch);ch=null}}
function save(){
  [cajaDate,ymd()].forEach(d=>{const c=C[d];if(c)sb.from('cajas').upsert({branch,d,value:c},{onConflict:'branch,d'}).then(r=>{if(r.error){msg=/cerrada/.test(r.error.message)?'🔒 La caja está cerrada; solo el superusuario puede modificarla.':'⚠️ Sin conexión: el cambio de caja no se guardó.';render()}})});
}
async function cobrar(){
  const t=total();if(!t||busy)return;
  if(C[ymd()]&&C[ymd()].closed){msg='🔒 La caja de hoy está cerrada. Reábrela en la pestaña Caja.';render();return}
  const rec=pay.m==='Efectivo'?parseFloat(pay.rec)||0:t;
  if(pay.m==='Efectivo'&&rec<t){msg='⚠️ El efectivo recibido es menor al total.';render();return}
  const items=Object.entries(cart).map(([id,q])=>{const p=prod(id);return{id:p.id,n:p.n,p:p.p,q}});
  busy=true;
  const r=await sb.rpc('registrar_venta',{p_branch:branch,p_m:pay.m,p_total:t,p_rec:rec,p_ch:rec-t,p_items:items});
  busy=false;
  if(r.error){
    msg=/Sin stock/.test(r.error.message)?'⚠️ '+r.error.message+'. Otro cajero se llevó el producto; revisa tu carrito.':/cerrada/.test(r.error.message)?'🔒 La caja de hoy está cerrada.':'⚠️ No se pudo registrar la venta. Revisa tu conexión.';
    await refresh();render();return;
  }
  const now=new Date();
  const sale={id:r.data,d:ymd(now),t:now.toISOString(),items,total:t,m:pay.m,rec,ch:rec-t};
  items.forEach(i=>{const p=prod(i.id);if(p&&p.s!==null)p.s-=i.q});
  S.push(sale);ticket=sale;cart={};pay.rec='';msg='';render();
}
async function delSale(id){
  if(!confirm('¿Cancelar esta venta? Se regresará el producto al inventario.'))return;
  const r=await sb.rpc('cancelar_venta',{p_id:id});
  if(r.error){msg=/superusuario/.test(r.error.message)?'⚠️ Solo el superusuario puede cancelar ventas.':'⚠️ No se pudo cancelar la venta.';render();return}
  const x=S.find(v=>v.id===id);
  if(x){x.items.forEach(i=>{const p=prod(i.id);if(p&&p.s!==null)p.s+=i.q});S.splice(S.indexOf(x),1)}
  render();
}
async function addProd(){
  const n=$('#nn').value.trim(),p=parseFloat($('#np').value),sv=$('#ns').value;
  if(!n||isNaN(p)||p<0)return;
  const r=await sb.from('products').insert({branch,n,p,s:sv===''?null:Math.max(0,parseInt(sv))}).select().single();
  if(r.error){msg='⚠️ No se pudo guardar el producto.';render();return}
  P.list.push({id:r.data.id,n:r.data.n,p:Number(r.data.p),s:r.data.s});render();
}
async function delProd(id){
  if(!confirm('¿Eliminar producto?'))return;
  const r=await sb.from('products').delete().eq('id',id).eq('branch',branch);
  if(r.error){msg='⚠️ No se pudo eliminar.';render();return}
  P.list=P.list.filter(x=>x.id!==id);render();
}
async function editPrice(id,v){
  const p=prod(id),n=parseFloat(v);if(!p||isNaN(n)||n<0)return;
  const r=await sb.from('products').update({p:n}).eq('id',id).eq('branch',branch);
  if(r.error){msg='⚠️ No se pudo guardar el precio.';render();return}
  p.p=n;
}
async function editStock(id,v){
  const p=prod(id);if(!p)return;
  const s=v===''?null:Math.max(0,parseInt(v)||0);
  const r=await sb.from('products').update({s}).eq('id',id).eq('branch',branch);
  if(r.error){msg='⚠️ No se pudo guardar el inventario.';render();return}
  p.s=s;render();
}
async function confirmarStock(){
  const T=trackedProds();
  const miss=T.filter(p=>{const v=stockChk[p.id];return v===undefined||v===''||isNaN(parseInt(v))});
  if(miss.length){stockMsg='⚠️ Falta capturar el conteo de: '+miss.map(p=>p.n).join(', ');render();return}
  const diffs=T.map(p=>({id:p.id,n:p.n,sys:p.s,real:Math.max(0,parseInt(stockChk[p.id]))})).filter(x=>x.real!==x.sys);
  for(const x of diffs){const r=await sb.rpc('ajustar_stock',{p_branch:branch,p_id:x.id,p_real:x.real});if(r.error){stockMsg='⚠️ No se pudo ajustar el inventario.';render();return}}
  diffs.forEach(x=>{prod(x.id).s=x.real});
  const c=cget(cajaDate);
  c.stock={at:new Date().toISOString(),n:T.length,diffs:diffs.map(x=>({n:x.n,sys:x.sys,real:x.real}))};
  stockChk=null;stockMsg='';finalizar(c);
}
async function loadBranches(){const r=await sb.from('branches').select('name').order('name');if(!r.error&&r.data&&r.data.length)BR=r.data.map(x=>x.name)}
async function loadProfiles(){
  const r=await sb.from('profiles').select('*').order('username');
  U=(r.data||[]).map(x=>({u:x.username,id:x.id,owner:x.role==='admin',b:x.branch,both:x.all_branches}));
}
async function fn(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch('/.netlify/functions/usuarios',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Error del servidor');
  return j;
}
function showLogin(){
  me=null;$('#appwrap').style.display='none';$('#login').style.display='block';
  $('#lt').textContent='Bienvenido';$('#ls').textContent='Inicia sesión para abrir tu caja';
  $('#lcw').style.display='none';$('#lbtn').textContent='Entrar';$('#lbtn').disabled=false;
  fillBranchSelects();$('#lp').value='';$('#le').textContent='';
}
async function doLogin(e){
  e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,br=$('#lb2').value;
  const err=m=>{$('#le').textContent=m;$('#lbtn').disabled=false};
  if(!u||!pw){err('Escribe tu usuario y contraseña.');return}
  $('#lbtn').disabled=true;$('#le').textContent='';
  const r=await sb.auth.signInWithPassword({email:u+DOM,password:pw});
  if(r.error){err('Usuario o contraseña incorrectos.');return}
  if(!await bootUser(br))await sb.auth.signOut();
}
async function bootUser(br){
  const ur=await sb.auth.getUser();const user=ur.data&&ur.data.user;if(!user)return false;
  const pr=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  const p=pr.data;
  if(!p){$('#le').textContent='Tu cuenta no tiene perfil. Avisa al superusuario.';$('#lbtn').disabled=false;return false}
  const f={u:p.username,id:p.id,owner:p.role==='admin',b:p.branch,both:p.all_branches};
  await loadBranches();fillBranchSelects();
  br=br||(BR.includes(f.b)?f.b:BR[0]);
  const m=branchError(f,br);
  if(m){$('#le').textContent=m;$('#lbtn').disabled=false;return false}
  me=f;
  try{await enter(br)}catch(e){me=null;$('#le').textContent='⚠️ No se pudieron cargar los datos de la nube.';$('#lbtn').disabled=false;return false}
  return true;
}
async function enter(br){
  if(!canAccess(me,br))return;
  await pull(br);
  branch=br;stockChk=null;load();cart={};ticket=null;msg='';
  try{sessionStorage.setItem('pos3_sess',br)}catch(e){}
  subscribeRT();
  if(me.owner)await loadProfiles();
  $('#login').style.display='none';$('#appwrap').style.display='block';
  const multi=me.owner||me.both;
  $('#who').textContent=me.u+(me.owner?' ★':'')+(multi?'':' · '+branch);
  const sw=$('#sw');sw.style.display=multi?'block':'none';sw.value=branch;
  document.querySelector('[data-t=prod]').style.display=me.owner?'':'none';
  setTab('venta');render();window.scrollTo({top:0});
}
async function logout(){
  stopRT();await sb.auth.signOut();
  try{sessionStorage.removeItem('pos3_sess')}catch(e){}
  cart={};ticket=null;stockChk=null;pay.rec='';me=null;U=[];repAll=false;
  for(const k in CACHE)delete CACHE[k];
  $('#lu').value='';showLogin();
}
async function addUser(){
  const u=$('#nu').value.trim().toLowerCase(),pw=$('#npw').value,b=$('#nb').value,both=$('#nboth').checked;
  if(!/^[a-z0-9._-]{3,30}$/.test(u)||pw.length<6){umsg='⚠️ Usuario: 3 a 30 caracteres (minúsculas, números, . _ -). Contraseña: mínimo 6.';render();return}
  try{await fn({action:'upsert',username:u,password:pw,branch:b,all_branches:both});await loadProfiles();umsg='✅ Usuario guardado.'}catch(e){umsg='⚠️ '+e.message}
  render();
}
async function delUser(i){
  const x=U[i];if(!x||x.owner)return;
  try{await fn({action:'delete',id:x.id});await loadProfiles();umsg='✅ Usuario eliminado.'}catch(e){umsg='⚠️ '+e.message}
  render();
}
async function addBranch(){
  const n=$('#nbr').value.trim().replace(/\s+/g,' ');
  if(!/^[\p{L}\p{N} .'-]{2,30}$/u.test(n)){bmsg='⚠️ Usa de 2 a 30 caracteres (letras, números, espacios).';render();return}
  if(BR.some(b=>b.toLowerCase()===n.toLowerCase())){bmsg='⚠️ Esa sucursal ya existe.';render();return}
  const r=await sb.from('branches').insert({name:n});
  if(r.error){bmsg='⚠️ No se pudo crear: '+r.error.message;render();return}
  await loadBranches();fillBranchSelects();bmsg='✅ Sucursal "'+n+'" creada. Ya puedes asignarle usuarios.';render();
}
async function delBranch(i){
  const b=BR[i];if(!b||b===branch||BR.length<2)return;
  if(U.some(x=>!x.owner&&x.b===b)){bmsg='⚠️ No se puede quitar: hay usuarios asignados a '+b+'.';render();return}
  try{await pull(b)}catch(e){bmsg='⚠️ No se pudo verificar la sucursal.';render();return}
  if(CACHE[b]&&CACHE[b].S&&CACHE[b].S.length){bmsg='⚠️ No se puede quitar: '+b+' ya tiene ventas registradas.';render();return}
  const r=await sb.from('branches').delete().eq('name',b);
  if(r.error){bmsg='⚠️ '+r.error.message;render();return}
  delete CACHE[b];await loadBranches();fillBranchSelects();bmsg='✅ Sucursal quitada.';render();
}
function backupCard(){return ''}
async function goAll(v){
  repAll=v;
  if(v&&me&&me.owner){try{await Promise.all(BR.filter(b=>b!==branch).map(b=>pull(b)))}catch(e){msg='⚠️ No se pudieron cargar todas las sucursales.'}}
  render();
}
function scopeBar(){
  if(!(me&&me.owner)||BR.length<2)return '';
  return `<div class="tabs" style="margin-top:0"><button class="${repAll?'':'on'}" onclick="goAll(false)">Sucursal actual</button><button class="${repAll?'on':''}" onclick="goAll(true)">Todas las sucursales</button></div>`;
}
function allSales(){
  const out=[];
  BR.forEach(b=>{const r=b===branch?{S}:CACHE[b];((r&&r.S)||[]).forEach(x=>out.push(Object.assign({br:b},x)))});
  return out;
}
(async()=>{
  $('#logo2').src=$('#logo').src;
  $('#lf').onsubmit=doLogin;
  $('#sw').onchange=e=>{if(me&&canAccess(me,e.target.value))enter(e.target.value);else if(me)e.target.value=branch};
  showLogin();render();
  if(SUPABASE_URL.includes('TU-PROYECTO')){$('#le').textContent='⚠️ Falta configurar public/config.js con los datos de Supabase.';return}
  await loadBranches();if(!BR.includes(branch))branch=BR[0];fillBranchSelects();
  const sr=await sb.auth.getSession();
  if(sr.data&&sr.data.session){let sb0=null;try{sb0=sessionStorage.getItem('pos3_sess')}catch(e){}await bootUser(sb0&&BR.includes(sb0)?sb0:null)}
})();
</script>
